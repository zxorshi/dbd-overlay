name: Build Windows installer
on:
  push:
    tags: ['v*']
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npm test
      - run: npx electron-builder@25 --win portable --publish never
      - uses: actions/upload-artifact@v4
        with: { name: installer, path: dist/*.exe }
