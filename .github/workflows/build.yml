name: Build and release
# Builds the Windows installer and publishes it as a GitHub release when the RELEASE file changes on main.
# Installed copies of the app update themselves from these releases.
on:
  push:
    branches: [main]
    paths: ['RELEASE']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - name: Set version from RELEASE
        shell: bash
        run: npm version "$(tr -d '[:space:]' < RELEASE)" --no-git-tag-version --allow-same-version
      - name: Build and publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: npx electron-builder@25 --win nsis --x64 --publish always
      - uses: actions/upload-artifact@v4
        with:
          name: DBD-Overlay-Setup
          path: dist/DBD-Overlay-Setup.exe
